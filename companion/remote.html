<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c10">
<title>Fresh Remote</title>
<style>
  :root { --bg:#0a0c10; --panel:#141920; --tile:#1a212b; --line:#232c38;
          --text:#e8edf4; --dim:#8b98a9; --accent:#4da3ff; --ok:#7EC98F; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display:flex; flex-direction:column;
         padding:env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
         user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  header { display:flex; align-items:center; gap:10px; padding:14px 18px 10px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#666; flex:none; }
  .dot.on { background:var(--ok); }
  header .name { font-size:15px; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  header a { margin-left:auto; color:var(--dim); font-size:12px;
             text-decoration:none; border:1px solid var(--line);
             border-radius:8px; padding:6px 12px; }
  #pad { flex:1; margin:8px 16px; background:var(--panel);
         border:1px solid var(--line); border-radius:20px;
         display:flex; align-items:center; justify-content:center;
         position:relative; min-height:200px; overflow:hidden; }
  #pad .hint { color:var(--dim); font-size:13px; letter-spacing:.1em; pointer-events:none; }
  #pad .flash { position:absolute; inset:auto; font-size:15px; color:var(--accent);
                pointer-events:none; opacity:0; transition:opacity .25s; }
  .row { display:flex; gap:10px; padding:10px 16px; }
  .row.controls { justify-content:center; }
  button.k { background:var(--tile); color:var(--text); border:1px solid #26303d;
             border-radius:12px; font-family:inherit; font-size:15px; font-weight:600;
             flex:1; padding:16px 0; display:flex; align-items:center; justify-content:center; }
  button.k:active { background:var(--accent); color:#06101c; }
  button.k.small { flex:0 0 21%; }
  button.k.power { color:#e06c6c; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:6px 16px 12px;
           scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; background:var(--panel); border:1px solid var(--line);
          color:var(--text); font-size:13px; font-weight:500; border-radius:20px;
          padding:10px 16px; font-family:inherit; }
  .chip:active { background:var(--accent); color:#06101c; }
  .label { color:var(--dim); font-size:11px; letter-spacing:.14em;
           text-transform:uppercase; padding:8px 18px 0; }
  #toast { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%;
           transform:translateX(-50%); background:#1d2632; border:1px solid var(--line);
           padding:10px 18px; border-radius:10px; font-size:13px; opacity:0;
           transition:opacity .2s; pointer-events:none; max-width:86vw; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <div>
      <div class="name" id="tvname">connecting…</div>
      <div class="sub" id="tvsub"></div>
    </div>
    <a href="/">launcher</a>
  </header>

  <div id="pad">
    <span class="hint">SWIPE TO NAVIGATE · TAP FOR OK</span>
    <span class="flash" id="flash"></span>
  </div>

  <div class="row controls">
    <button class="k small" data-key="KEY_RETURN">BACK</button>
    <button class="k small" data-key="KEY_HOME">HOME</button>
    <button class="k small" data-key="KEY_MUTE">MUTE</button>
    <button class="k small power" id="power">⏻</button>
  </div>
  <div class="row controls">
    <button class="k" data-key="KEY_VOLDOWN">VOL −</button>
    <button class="k" data-key="KEY_VOLUP">VOL +</button>
    <button class="k" id="wake">WAKE</button>
  </div>

  <div class="label">Apps</div>
  <div class="chips" id="apps"></div>

  <div class="label">Cloud gaming</div>
  <div class="chips" id="cloud"></div>

  <div id="toast"></div>

<script>
(function () {
  'use strict';
  var flashEl = document.getElementById('flash');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }
  function buzz() { if (navigator.vibrate) navigator.vibrate(12); }
  function flash(text) {
    flashEl.textContent = text;
    flashEl.style.opacity = 1;
    setTimeout(function () { flashEl.style.opacity = 0; }, 220);
  }

  async function api(path, body) {
    var r = await fetch(path, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : undefined);
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  async function sendKey(key) {
    buzz(); flash(key.replace('KEY_', ''));
    try { await api('/api/key', { key: key }); }
    catch (e) { toast(e.message); }
  }

  document.querySelectorAll('button[data-key]').forEach(function (b) {
    b.addEventListener('click', function () { sendKey(b.dataset.key); });
  });
  document.getElementById('power').addEventListener('click', function () {
    if (confirm('Toggle TV power?')) sendKey('KEY_POWER');
  });
  document.getElementById('wake').addEventListener('click', async function () {
    buzz();
    try { await api('/api/wake'); toast('Wake packet sent'); }
    catch (e) { toast(e.message); }
  });

  // touch surface: swipe = arrow keys, tap = OK
  var pad = document.getElementById('pad');
  var sx = 0, sy = 0, moved = false, t0 = 0;
  pad.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; moved = false; t0 = Date.now();
  }, { passive: true });
  pad.addEventListener('touchmove', function (e) {
    if (moved) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 34 && Math.abs(dy) < 34) return;
    moved = true;
    if (Math.abs(dx) > Math.abs(dy)) sendKey(dx > 0 ? 'KEY_RIGHT' : 'KEY_LEFT');
    else sendKey(dy > 0 ? 'KEY_DOWN' : 'KEY_UP');
  }, { passive: true });
  pad.addEventListener('touchend', function (e) {
    if (moved) return;
    if (Date.now() - t0 > 600) return;                 // long-press = ignore
    var t = e.changedTouches[0];
    if (Math.abs(t.clientX - sx) < 12 && Math.abs(t.clientY - sy) < 12) sendKey('KEY_ENTER');
  });

  // app shortcuts
  api('/api/apps').then(function (j) {
    var apps = document.getElementById('apps');
    j.apps.slice(0, 14).forEach(function (a) {
      var c = document.createElement('button');
      c.className = 'chip';
      c.textContent = a.name;
      c.addEventListener('click', async function () {
        buzz();
        try { await api('/api/launch', { id: a.appId }); toast('Launching ' + a.name); }
        catch (e) { toast(e.message); }
      });
      apps.appendChild(c);
    });
  }).catch(function () {});

  // cloud gaming — opens in the TV's browser
  var CLOUD = [
    { name: 'Xbox Cloud', url: 'https://www.xbox.com/play' },
    { name: 'GeForce NOW', url: 'https://play.geforcenow.com' },
    { name: 'Amazon Luna', url: 'https://luna.amazon.com' },
    { name: 'PS Remote Play', url: 'https://remoteplay.dl.playstation.net/' },
    { name: 'Steam Link (app)', appId: '3201702011851' }
  ];
  var cloud = document.getElementById('cloud');
  CLOUD.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c.name;
    b.addEventListener('click', async function () {
      buzz();
      try {
        if (c.appId) { await api('/api/launch', { id: c.appId }); toast('Launching ' + c.name); }
        else { await api('/api/browse', { url: c.url }); toast('Opening ' + c.name); }
      } catch (e) { toast(e.message); }
    });
    cloud.appendChild(b);
  });

  // status
  api('/api/status').then(function (st) {
    document.getElementById('dot').classList.toggle('on', !!st.paired);
    document.getElementById('tvname').textContent = st.friendly || st.ip || 'TV not found';
    document.getElementById('tvsub').textContent = (st.model || '') + ' · ' + (st.ip || '');
  }).catch(function () {
    document.getElementById('tvname').textContent = 'server unreachable';
  });
})();
</script>
</body>
</html>
